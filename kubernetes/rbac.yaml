apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-agent-reader
  namespace: mlops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlops-agent-reader
  namespace: mlops
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, events]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlops-agent-reader
  namespace: mlops
subjects:
  - kind: ServiceAccount
    name: mlops-agent-reader
    namespace: mlops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mlops-agent-reader
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-agent-operator
  namespace: mlops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlops-agent-restart
  namespace: mlops
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [prediction-api]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlops-agent-operator
  namespace: mlops
subjects:
  - kind: ServiceAccount
    name: mlops-agent-operator
    namespace: mlops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mlops-agent-restart
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlops-agent-operator-read
  namespace: mlops
subjects:
  - kind: ServiceAccount
    name: mlops-agent-operator
    namespace: mlops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mlops-agent-reader
