[build-system]
requires = ["setuptools==80.3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-ai-agent"
version = "1.0.0"
description = "Evidence-based operations across DVC, MLflow, Airflow 3, and Kubernetes"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "pydantic-settings==2.9.1",
  "httpx==0.28.1", "openai==1.78.1", "mlflow-skinny==2.22.0",
  "scikit-learn==1.6.1", "kubernetes==32.0.1", "dvc==3.59.2",
  "pathspec==0.12.1", "scipy==1.15.3", "pydantic==2.11.4", "networkx==3.4.2", "numpy==2.2.5", "pandas==2.2.3", "joblib==1.5.0", "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-cov==6.1.1", "ruff==0.11.9", "build==1.2.2.post1"]

[project.scripts]
mlops-agent = "agent.main:main"

[tool.setuptools.packages.find]
include = ["agent*", "api*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=agent --cov=api --cov=training --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
