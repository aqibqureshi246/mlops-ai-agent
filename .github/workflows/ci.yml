name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.7.3
      - name: Install locked environment
        run: |
          uv sync --locked --extra dev --python python
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: ruff check .
      - name: Verify formatting
        run: ruff format --check .
      - name: Test with mocked external services
        run: pytest --junitxml=.tmp/test-results.xml
      - name: Check tracked submission files
        run: python scripts/check_submission.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-python-${{ matrix.python-version }}
          path: .tmp/test-results.xml
