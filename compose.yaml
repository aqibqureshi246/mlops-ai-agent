name: mlops-a3
services:
  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    ports: ["127.0.0.1:5000:5000"]
    volumes: ["mlflow-data:/mlflow"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_DB: airflow
      POSTGRES_PASSWORD: ${MLOPS_POSTGRES_PASSWORD:?Run python scripts/setup_local.py first}
    volumes: ["airflow-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 20
  airflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    user: "${MLOPS_AIRFLOW_UID:-50000}:0"
    command: standalone
    ports: ["127.0.0.1:8080:8080"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__API__WORKERS: "1"
      AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: student:user
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /run/airflow-passwords.json
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${MLOPS_POSTGRES_PASSWORD}@postgres/airflow
      AIRFLOW__API_AUTH__JWT_SECRET: ${MLOPS_AIRFLOW_JWT_SECRET:?Run setup_local.py}
      AIRFLOW__API_AUTH__JWT_ISSUER: mlops-a3
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://localhost:8080/execution/
      GIT_OPTIONAL_LOCKS: "0"
      PYTHONPATH: /opt/project
      MLOPS_REPO_ROOT: /opt/project
      MLOPS_MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - .:/opt/project:ro
      - ./artifacts:/opt/project/artifacts
      # SimpleAuthManager opens the password file in a+ mode during startup.
      - ./.runtime/airflow-passwords.json:/run/airflow-passwords.json
      - airflow-logs:/opt/airflow/logs
    depends_on:
      postgres: {condition: service_healthy}
      mlflow: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health')"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
  ollama:
    image: ollama/ollama:0.6.8
    profiles: [local-llm]
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ollama-data:/root/.ollama"]
    environment:
      OLLAMA_CONTEXT_LENGTH: "16384"
      OLLAMA_NUM_PARALLEL: "1"
volumes:
  mlflow-data:
  airflow-db:
  airflow-logs:
  ollama-data:
